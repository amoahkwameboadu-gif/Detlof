<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="Detlof%20creast.png" />
  <title>Detlof Preparatory School — Student Portal</title>
  <style>
    :root {
      --ink: #2a1730;
      --muted: #75697a;
      --line: #eadfe9;
      --canvas: #faf7f3;
      --crest-purple: #7a1591;
      --crest-purple-dark: #560f75;
      --crest-purple-soft: #f3e7f7;
      --crest-gold: #f2b500;
      --crest-gold-dark: #b87a00;
      --crest-gold-soft: #fff3c4;
      --crest-blue: #1a337e;
      --crest-blue-light: #2547a8;
      --shadow: 0 16px 34px rgba(42, 23, 48, 0.1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: clamp(26px, 5vw, 40px);
      box-shadow: var(--shadow);
      max-width: 470px;
      width: 100%;
      text-align: center;
    }
    .logo { width: 80px; height: 94px; margin: 0 auto 18px; object-fit: contain; }
    h1 { font-size: clamp(24px, 4vw, 32px); margin: 0 0 10px; letter-spacing: -0.03em; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--crest-gold); font-weight: 800; margin-bottom: 14px; }
    p.lead { color: var(--muted); margin: 0 0 26px; font-size: 14px; }
    .buttons { display: grid; gap: 12px; }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 13px 16px; border-radius: 9px; font-weight: 700; font-size: 14px;
      text-decoration: none; border: 0; transition: transform .1s, box-shadow .18s;
    }
    a.btn:active { transform: translateY(1px); }
    a.student-btn { background: var(--crest-purple); color: #fff; }
    a.student-btn:hover { background: var(--crest-purple-dark); box-shadow: 0 8px 18px rgba(42, 23, 48, 0.14); }
    .footer { margin-top: 18px; font-size: 11px; color: var(--muted); }
    @media (max-width: 560px) {
      .card { padding: 22px; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="Detlof%20creast.png" alt="Detlof Preparatory School crest" />
    <div class="eyebrow">Wisdom Balance</div>
    <h1>Detlof Preparatory School</h1>
    <p class="lead">Student Information Portal — academic results, class timetable, and school announcements.</p>
    <div class="buttons">
      <a class="btn student-btn" href="detlof-student-portal.html">Go to Student Login</a>
    </div>
    <p class="footer">© 2025 Detlof Preparatory School</p>
  </main>
</body>
</html>
