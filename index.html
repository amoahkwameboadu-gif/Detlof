<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="Detlof%20creast.png" />
  <title>Detlof Preparatory School — Student Portal</title>
  <style>
    :root {
      --ink: #2a1730;
      --muted: #c4b5c9;
      --line: #eadfe9;
      --canvas: #1a0f20;
      --crest-purple: #7a1591;
      --crest-purple-dark: #560f75;
      --crest-purple-soft: #f3e7f7;
      --crest-gold: #f2b500;
      --crest-gold-dark: #b87a00;
      --crest-gold-soft: #fff3c4;
      --crest-blue: #1a337e;
      --shadow: 0 16px 34px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a0f20 0%, #2a1730 40%, #1a337e 100%);
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; position: relative; overflow: hidden; }
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(2px);
    }
    body::before { width: 260px; height: 260px; top: -90px; right: -70px; background: rgba(242,181,0,.18); }
    body::after { width: 220px; height: 220px; bottom: -100px; left: -70px; background: rgba(122,21,145,.28); }
    .watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 580px;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
      object-fit: contain;
      filter: blur(2px);
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: clamp(34px, 5vw, 54px);
      box-shadow: var(--shadow);
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
    }
    .logo { width: 154px; height: 178px; margin: 0 auto 18px; object-fit: contain; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.34)); }
    h1 { font-size: clamp(26px, 4vw, 34px); margin: 0 0 10px; letter-spacing: -0.03em; color: #fff; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--crest-gold); font-weight: 800; margin-bottom: 14px; }
    p.lead { color: var(--muted); margin: 0 auto 28px; font-size: 14px; max-width: 360px; }
    .buttons { display: grid; gap: 12px; }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 14px 16px; border-radius: 10px; font-weight: 700; font-size: 14px;
      text-decoration: none; border: 0; transition: transform .1s, box-shadow .18s;
    }
    a.btn:active { transform: translateY(1px); }
    a.student-btn { background: linear-gradient(135deg, #9d20b8, var(--crest-purple)); color: #fff; box-shadow: 0 10px 22px rgba(122,21,145,.3); }
    a.student-btn:hover { background: linear-gradient(135deg, #b52bd0, var(--crest-purple-dark)); box-shadow: 0 12px 26px rgba(42, 23, 48, 0.28); transform: translateY(-2px); }
    .footer { margin-top: 18px; font-size: 11px; color: var(--muted); }
    @media (max-width: 560px) {
      .card { padding: 24px; }
      body { padding: 16px; }
      .logo { width: 126px; height: 146px; }
      .watermark { width: 320px; height: 370px; }
    }
    @media (max-width: 400px) {
      .logo { width: 108px; height: 126px; }
      .watermark { width: 260px; height: 300px; }
    }
  </style>
</head>
<body>
  <img class="watermark" src="Detlof%20creast.png" alt="" aria-hidden="true" />
  <main class="card">
    <img class="logo" src="Detlof%20creast.png" alt="Detlof Preparatory School crest" />
    <div class="eyebrow">Wisdom Balance</div>
    <h1>Detlof Preparatory School</h1>
    <p class="lead">Student Information Portal — academic results, class timetable, and school announcements.</p>
    <div class="buttons">
      <a class="btn student-btn" href="detlof-student-portal.html">Click to Sign In to Student Portal <span aria-hidden="true">→</span></a>
    </div>
    <p class="footer">© 2025 Detlof Preparatory School</p>
  </main>
</body>
</html>
